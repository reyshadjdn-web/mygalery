<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.85" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" />

  <!-- Vault Ring / Camera Aperture Glow -->
  <circle cx="256" cy="240" r="140" fill="none" stroke="url(#glowGrad)" stroke-width="16" opacity="0.6" filter="url(#dropShadow)" />

  <!-- Camera Body Outline -->
  <path d="M150 190 L180 150 L332 150 L362 190 L390 190 C406 190 420 204 420 220 L420 350 C420 366 406 380 390 380 L122 380 C106 380 92 366 92 350 L92 220 C92 204 106 190 122 190 Z" 
        fill="rgba(15, 23, 42, 0.45)" stroke="url(#shieldGrad)" stroke-width="10" stroke-linejoin="round" />

  <!-- Lens Outer Ring -->
  <circle cx="256" cy="285" r="72" fill="#0f172a" stroke="#ffffff" stroke-width="8" />

  <!-- Lens Aperture Glass -->
  <circle cx="256" cy="285" r="54" fill="url(#bgGrad)" />

  <!-- Center Vault Lock / Spark -->
  <circle cx="256" cy="285" r="22" fill="#ffffff" />
  <circle cx="264" cy="277" r="7" fill="#ffffff" opacity="0.8" />

  <!-- Flash / Secure Badge -->
  <circle cx="360" cy="225" r="14" fill="#38bdf8" />
  
  <!-- Cloud Protection Badge at bottom right -->
  <g transform="translate(290, 310) scale(0.85)">
    <circle cx="90" cy="90" r="45" fill="#10b981" filter="url(#dropShadow)" />
    <!-- Checkmark / Lock icon -->
    <path d="M74 90 L85 101 L106 78" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
